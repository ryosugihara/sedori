# 新旧の目の精度くらべ（CLIP/DINO-base vs SigLIP/DINO-large）。
# 同じ商品/違う商品ペアで両方の目を測り、どちらが優秀かを実測する。
name: 新旧の目 精度くらべ

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: AIモデルの置き場をキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
          key: siglip-so400m-dinov2large-rembg-clip
      - name: AIの道具を入れる
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python-headless sentence-transformers transformers pillow \
                              numpy sentencepiece protobuf rembg onnxruntime pyjwt cryptography
      - name: 新旧くらべを実行
        run: python せどり/コーディング/scripts/calibrate_v2.py
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon || true
          git commit -m "新旧の目 精度くらべの結果を保存 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
