# Anthropic(Claude)のカギの動作テスト（軽量・約1分・費用約0.1円）
#
# 何をするか: GitHub Secrets の ANTHROPIC_API_KEY でClaudeに短い挨拶を1回送り、
#   成功/失敗と失敗原因を recon/CLAUDE_KEY_TEST.txt とDiscordに報告する。
#   メルカリには一切アクセスしない。Geminiのカギも使わない。
# 動かし方: このファイルか test_claude_key.py をpushすると自動で1回動く。手動(Run workflow)も可。
name: Claudeカギの動作テスト

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/test_claude_key.py"
      - ".github/workflows/test-claude-key.yml"

permissions:
  contents: write

concurrency:
  group: test-claude-key
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: テストを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python せどり/コーディング/scripts/test_claude_key.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon/CLAUDE_KEY_TEST.txt || true
          git commit -m "Claudeカギの動作テスト: 結果を保存 [skip ci]" || { echo "変更なし"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push && exit 0
            echo "push失敗 ($i/3) → 5秒待って再試行"; sleep 5
          done
          echo "::warning::結果の保存(push)に失敗しました"
