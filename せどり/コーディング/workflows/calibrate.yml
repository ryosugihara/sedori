# 画像判定の精度測定（同じ商品/違う商品ペアで合格ラインを実測する）
name: 画像判定の精度測定

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/calibrate.py"
      - ".github/workflows/calibrate.yml"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: AIの道具を入れる
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python-headless sentence-transformers transformers pillow pyjwt cryptography

      - name: 精度測定を実行
        run: python せどり/コーディング/scripts/calibrate.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon
          git commit -m "精度測定の結果を保存 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
