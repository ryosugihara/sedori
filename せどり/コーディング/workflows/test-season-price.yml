# 季節で相場が変わるかの測定（軽量・数分）
#
# 何をするか: 相場DBの『いつ・いくらで売れたか』を数えて、冬物・夏物が
#   シーズン中とシーズン外で値段が違うかを調べる。通年物(デニム等)を対照群にして、
#   本当に季節の影響なのかを見分ける。
# メルカリへの負荷: ゼロ。重いAIも使わない（手元のDBを数えるだけ）
name: 季節と相場の測定

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/test_season_price.py"
      - ".github/workflows/test-season-price.yml"

permissions:
  contents: write

concurrency:
  group: test-season-price
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 相場DBをReleaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p せどり/データ/data
          if python せどり/コーディング/scripts/db_release.py download; then
            echo "相場DBを取得しました"
          else
            echo "相場DBがまだ無いため中止します"
            exit 1
          fi

      - name: 測定を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python せどり/コーディング/scripts/test_season_price.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon/SEASON_PRICE.txt || true
          git commit -m "季節と相場の測定: 結果を保存 [skip ci]" || { echo "変更なし"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push && exit 0
            echo "push失敗 ($i/3) → 5秒待って再試行"; sleep 5
          done
          echo "::warning::結果の保存(push)に失敗しました"
