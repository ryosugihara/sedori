# 写真判定（服かバッグか）の精度測定（約5分）
#
# 何をするか: 相場DBに保存済みの写真の指紋を使い、「写真だけで服とバッグを
#   見分けられるか」を測る。服を誤って捨てる率が十分低ければ、priority.json の
#   『写真で判定する』を true にして本番で使う。
# メルカリへの負荷: ゼロ（保存済みの指紋を使うだけで、写真もページも取りに行かない）
name: 写真判定の精度測定

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/test_image_category.py"
      - ".github/workflows/test-image-category.yml"

permissions:
  contents: write

concurrency:
  group: test-image-category
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ（2回目から速くなる）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: 画像判定AIを入れる
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet sentence-transformers pillow

      - name: 相場DBをReleaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p せどり/データ/data
          if python せどり/コーディング/scripts/db_release.py download; then
            echo "相場DBを取得しました"
          else
            echo "相場DBがまだ無いため中止します"
            exit 0
          fi

      - name: 精度測定を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python せどり/コーディング/scripts/test_image_category.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon/IMAGE_CATEGORY_CALIB.txt || true
          git commit -m "写真判定の精度測定: 結果を保存 [skip ci]" || { echo "変更なし"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push && exit 0
            echo "push失敗 ($i/3) → 5秒待って再試行"; sleep 5
          done
          echo "::warning::結果の保存(push)に失敗しました"
