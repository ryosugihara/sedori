# 色比較(改良版ヒストグラム vs 旧・平均色)の精度テスト。
# 同じ商品/違う商品ペアで、色比較が色違いをちゃんと弾けるか実測する。
# 重いAIモデルは不要（色計算だけ）なので軽い。
name: 色比較テスト

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  color-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 道具を入れる（色計算とメルカリ取得だけ・軽量）
        run: pip install --quiet opencv-python-headless numpy pillow pyjwt cryptography
      - name: 色比較テストを実行
        run: python せどり/コーディング/scripts/color_check.py
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon || true
          git commit -m "色比較テストの結果を保存 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
