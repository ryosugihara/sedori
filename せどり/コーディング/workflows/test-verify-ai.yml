# 最終確認AIの「点数」の精度測定（手動起動のみ・約5分）
#
# 何をするか:
#   メルカリの検索結果から「同じ商品の写真2枚」「違う商品の写真2枚」のペアを作り、
#   AI(verify_ai.py)に点数を付けさせて、souba.json の合格ライン
#   （AI確認_同じと判定する点数）を決めるための表を作る。
# メルカリへの負荷:
#   検索API3回＋商品詳細（1秒間隔・1キーワード最大ペア数×3回）。写真は配信サーバーから取得。
#   AIは5秒間隔・最大60回（TEST_PAIRS / MAX_AI_CALLS で調整可）。
name: AI点数の精度測定（校正用）

on:
  workflow_dispatch:
    inputs:
      pairs_per_keyword:
        description: "1キーワードあたりの同商品ペア数（既定15。増やすとAI呼び出しも増える）"
        required: false
        default: "15"
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      # このワークフロー自身か測定スクリプトが更新されたら自動で1回動く
      # （スマホだと Run workflow ボタンが表示されないため。test-gemini と同じ方式）
      - ".github/workflows/test-verify-ai.yml"
      - "せどり/コーディング/scripts/test_verify_ai.py"

permissions:
  contents: write

concurrency:
  group: test-verify-ai
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要な道具を入れる（メルカリ検索の署名用だけ。AIモデルは不要）
        run: pip install --quiet pyjwt cryptography

      - name: 精度測定を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_PAIRS: ${{ github.event.inputs.pairs_per_keyword || '15' }}
          MAX_AI_CALLS: "60"
        run: python せどり/コーディング/scripts/test_verify_ai.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon/AI_VERIFY_CALIB.txt せどり/データ/recon/AI_VERIFY_LOG.txt || true
          git commit -m "AI点数の精度測定: 結果を保存 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
