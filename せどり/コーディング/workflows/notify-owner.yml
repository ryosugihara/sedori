# リポジトリの持ち主への連絡（Discordに1通送るだけ）
#
# 使い方: 下の MESSAGE の中身を書き換えてこのファイルをpushすると、
#         Discordに1回だけ送信される（自動の繰り返しは無し）。
# 注意: 秘密情報（カギの値など）・個人情報は絶対に書かない。
name: 持ち主への連絡

on:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - ".github/workflows/notify-owner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-owner
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discordに連絡を送る
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request
          MESSAGE = """📮 **リポジトリの持ち主へ: お願いと報告（2026-08-24 システム改修より）**

          【お願い①・推奨】AnthropicのAPIキーの登録
          写真の最終確認AIは無料のGemini優先ですが、夜間は混雑・回数制限で使えない時間帯があると判明しました。Anthropicのカギを登録すると、その間だけ自動で有料AI（1判定 約0.5〜1円、1日十数回程度）に切り替わり、通知の取りこぼしが減ります。
          手順:
          1. console.anthropic.com にログイン → API Keys → Create Key でカギを作る
          2. GitHubのこのリポジトリ → Settings → Secrets and variables → Actions → New repository secret
          3. Name に ANTHROPIC_API_KEY、Secret にカギの値を貼って保存
          ※カギの値は絶対にコード・チャット・Discordに貼らないでください（この登録画面だけに入力）

          【報告①】「エラーで通知が止まらなくなる」不具合の原因を特定し、修正しました
          原因: 通知後に「見た商品の記録」をサーバーへ即保存する処理が、保存先の指定ミスで一度も動いておらず、実行が途中で失敗すると次の実行が数時間分の通知を再送していました。加えて、保存時に他の自動処理と衝突すると保存自体が失敗する弱さもありました。
          修正: 保存先の指定を修正し、衝突しても3回まで再試行する方式に全ワークフローを統一しました。今後、再送が起きたらこの通知チャンネルの重複をご一報ください。

          【報告②】相場の見方が新しくなりました
          通知に「相場 安全/標準/強気（根拠n件・信頼度）」が表示されます。安全=控えめな相場、強気=高めに売れた実例です。出品価格の目安にお使いください。

          ※作業の詳細記録: リポジトリの「せどり/壁打ち/未解決事項.md」"""
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK_URL 未設定のため送信できません")
              raise SystemExit(1)
          req = urllib.request.Request(
              webhook,
              data=json.dumps({"content": MESSAGE[:1900]}).encode(),
              headers={"Content-Type": "application/json",
                       "User-Agent": "sedori-bot/1.0 (+https://github.com/ryosugihara/sedori)"})
          urllib.request.urlopen(req, timeout=30)
          print("送信しました")
          EOF
