# 相場DBの大掃除（既定は「下見」。消すには自分で delete を選ぶ必要がある）
#
# 何をするか: 相場DBの中身を「服以外」「単色すぎる服」「対象外ブランド」で仕分けて
#   件数と例を報告する。mode に delete を選び、消したい物差しのスイッチを on にした
#   時だけ、実際に削除して相場DBを保存し直す。
# メルカリへの負荷: ゼロ（検索APIは使わない）。単色を調べる時だけ、写真の配信サーバーから
#   画像を取得する（同時4本まで）。
name: 相場DBの大掃除

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry=下見（消さない） / delete=実際に消す"
        default: "dry"
        required: false
      color_limit:
        description: "単色度を調べる件数（0=調べない、-1=全件）"
        default: "1500"
        required: false
      plain_ratio:
        description: "単色と判断する『1色の割合』(0.3〜0.7。大きいほど消す数が減る)"
        default: "0.5"
        required: false
      del_non_clothing:
        description: "服以外を消す (1=消す)"
        default: "0"
        required: false
      del_plain:
        description: "単色すぎる服を消す (1=消す)"
        default: "0"
        required: false
      del_other_brands:
        description: "対象外ブランドを消す (1=消す)"
        default: "0"
        required: false
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/souba_db_cleanup.py"
      - ".github/workflows/souba-db-cleanup.yml"

permissions:
  contents: write

# 相場DBを書き換える処理どうしが同時に走らないようにする
concurrency:
  group: souba-db-write
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: 必要な道具を入れる
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python-headless sentence-transformers pillow numpy

      - name: 相場DBをReleaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p せどり/データ/data
          if python せどり/コーディング/scripts/db_release.py download; then
            echo "相場DBを取得しました"
          else
            echo "相場DBがまだ無いため中止します"
            exit 1
          fi

      - name: 大掃除（既定は下見）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # ⚠️ 2026-09-30: 承認を得た一回限りの削除のため、既定を delete にしている。
          # この回が終わったら既定を dry（下見）に戻すこと
          CLEANUP_MODE: ${{ github.event.inputs.mode || 'delete' }}
          COLOR_LIMIT: ${{ github.event.inputs.color_limit || '-1' }}
          PLAIN_RATIO: ${{ github.event.inputs.plain_ratio || '0.7' }}
          DEL_NON_CLOTHING: ${{ github.event.inputs.del_non_clothing || '1' }}
          DEL_PLAIN: ${{ github.event.inputs.del_plain || '1' }}
          DEL_OTHER_BRANDS: ${{ github.event.inputs.del_other_brands || '1' }}
        run: python せどり/コーディング/scripts/souba_db_cleanup.py

      - name: 相場DBをReleaseに保存（実際に消した時だけ）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/souba_db_changed ]; then
            python せどり/コーディング/scripts/db_release.py upload
          else
            echo "DBに変更が無いため保存はスキップ（下見モード）"
          fi

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon/SOUBA_DB_CLEANUP.txt || true
          git commit -m "相場DBの大掃除: 結果を保存 [skip ci]" || { echo "変更なし"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push && exit 0
            echo "push失敗 ($i/3) → 5秒待って再試行"; sleep 5
          done
          echo "::warning::結果の保存(push)に失敗しました"
