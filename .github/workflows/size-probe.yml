name: サイズ読み取りの確認

on:
  push:
    paths:
      - ".github/workflows/size-probe.yml"
      - "せどり/コーディング/scripts/size_probe.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 各お店の商品ページからサイズが読めるか確かめる
        run: python せどり/コーディング/scripts/size_probe.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon/SIZE_PROBE.txt
          git commit -m "サイズ読み取りの確認結果 [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash origin ${{ github.ref_name }} || true; git push && exit 0; sleep 5; done
