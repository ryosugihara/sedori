# リポジトリの持ち主への連絡（Discordに1通送るだけ）
#
# 使い方: 下の MESSAGE の中身を書き換えてこのファイルをpushすると、
#         Discordに1回だけ送信される（自動の繰り返しは無し）。
# 注意: 秘密情報（カギの値など）・個人情報は絶対に書かない。
name: 持ち主への連絡

on:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - ".github/workflows/notify-owner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-owner
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discordに連絡を送る
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request
          MESSAGE = """📢 **システム改修のまとめ（2026-08-24〜25 実施）と今後の予定**

■ 今回直したこと（全部で5つ）
**1. 相場（売れそうな値段）の決め方を賢くしました**
今まで: 似た売却実例5件のうち「安い方から2番目」の1つの値段だけで判断
これから: 実例を最大30件集め、極端に高い/安い実例（まとめ売り等）を自動で除いてから
「安全 / 標準 / 強気」の3段階で表示。通知に根拠の件数と信頼度（高/中/低）も出ます。
→ 出品価格を決める時は「強気」が実際に高く売れた実績値です

**2. 相場データの掃除**
まとめ売り・ジャンク・箱のみ・新品などの値段が相場に混ざらないようにしました
（データベース本体の掃除は9/1の定期収集で自動実行）

**3. 写真の最終確認AIの強化**
今まで: 「同じ/違う」の1語だけ
これから: 一致度0〜100点＋理由付き。判定の理由が記録に残るので、
「なぜ通知されなかったか」を後から調べられます

**4. 「同じ通知が繰り返し届く」不具合を修正**
原因は通知記録の保存処理の不備でした。保存先の指定ミスを直し、
保存が失敗しても3回まで自動でやり直す方式に変えました。
もし今後も重複通知があればお知らせください

**5. この連絡の仕組み**
今後の報告・お願いはこの形でお届けします

■ 今後の予定
・本日16時以降: AIの点数の「合格ライン」を実データで測定して調整
・実例が足りないブランドを特定し、検索キーワードを追加（データベースを育てる）
・9/1: 定期収集でデータベース拡充＋掃除の反映

■ 引き続きのお願い
AnthropicのAPIキー登録（前回の連絡参照）。無料AIが混雑する夜間の
判定を安定させるためです（費用: 1判定 約0.5〜1円・1日十数回程度）

※詳細な記録: リポジトリの「せどり/壁打ち/未解決事項.md」"""
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              print("DISCORD_WEBHOOK_URL 未設定のため送信できません")
              raise SystemExit(1)
          req = urllib.request.Request(
              webhook,
              data=json.dumps({"content": MESSAGE[:1900]}).encode(),
              headers={"Content-Type": "application/json",
                       "User-Agent": "sedori-bot/1.0 (+https://github.com/ryosugihara/sedori)"})
          urllib.request.urlopen(req, timeout=30)
          print("送信しました")
          EOF
