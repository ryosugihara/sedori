# 新着監視（KINDALは10秒ごと・他の店は30秒ごとに見張り続けるループ方式）
name: KINDAL新着監視

on:
  schedule:
    # 本命の継続方法は「終わる時に次の回を自分で起動する」(下の最後のステップ)。
    # 定時起動はチェーンが切れた時の保険。※GitHubは混雑時に定時起動を間引くため
    # (実測 2026-11: 2時間ごと予約でも1日2〜3回しか起動されなかった)、これだけには頼らない。
    - cron: "17 */2 * * *" # 2時間ごと（毎時0分の混雑を避けて17分）
    - cron: "20 0 * * *"   # 毎日 9:20(日本時間)。RINKANの10〜12時に必ず監視を動かすための保険
  push:
    # 監視のプログラムを直して保存したら、新しいプログラムですぐ監視を始める
    # （動いている回があれば、その回が終わった直後に新しいプログラムで引き継ぐ）
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - ".github/workflows/monitor.yml"
      - "せどり/コーディング/scripts/monitor.py"
  workflow_dispatch: # 手動でも開始できる
    inputs:
      loop_minutes:
        description: "1回の監視時間(分)。テスト用に短くもできる"
        default: "300"
        required: false

permissions:
  contents: write
  actions: write # 終わる時に次の監視を自分で起動するため（GITHUB_TOKENで可能・PAT不要）

# 同時に2つ動いて記録がぶつからないようにする
concurrency:
  group: kindal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 安全のための最大時間（6時間）
    steps:
      - name: 開始時刻を記録（異常終了時の連続再起動を防ぐ判定に使う）
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ（2回目から速くなる）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      # 画像判定AI(CLIP)の道具。入らなくても監視自体は止めない（②だけ休む）
      - name: 画像判定AIを準備（失敗しても監視は続行）
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu || true
          pip install --quiet opencv-python-headless sentence-transformers pillow || true

      - name: 相場DBをReleaseから取得（無ければ画像判定なしで続行）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p せどり/データ/data
          if python せどり/コーディング/scripts/db_release.py download; then
            echo "相場DBを取得しました"
          else
            echo "相場DBがまだ無い。画像判定なしで続行"
          fi

      - name: 新着監視（ループ）を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOOP_MODE: "1" # ループ監視を有効にする
          POLL_SECONDS: "30" # KINDAL以外の店を何秒ごとにチェックするか
          KINDAL_POLL_SECONDS: "10" # KINDAL(1ページ目)を何秒ごとにチェックするか
          RINKAN_WINDOW: "10:00-12:00" # RINKANの出品が多い時間帯(日本時間)。この間は監視の交代もしない
          RINKAN_WINDOW_SECONDS: "10" # 上の時間帯にRINKANを何秒ごとにチェックするか
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '300' }} # 1回の見張り時間（分）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 無料AIのカギ(あれば最終確認に使う)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 有料AIのカギ(任意)
        run: python せどり/コーディング/scripts/monitor.py

      - name: 見た商品リストを保存
        if: always() # 途中で終わっても最後に保存を試みる
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # コミットしないログ(recon)の変更が残っていると pull --rebase が失敗し、
          # 記録を保存できず「同じ商品を再通知し続ける」原因になるため先に捨てる
          git checkout -- せどり/データ/recon 2>/dev/null || true
          git add せどり/データ/state
          git commit -m "新着監視: 状態を更新 [skip ci]" || { echo "変更なし"; exit 0; }
          # 他のワークフローが先に保存していても衝突しないよう、取り込んでから押す。
          # 失敗したら2回まで再試行（保存に失敗すると同じ商品を再通知してしまうため）
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push && exit 0
            echo "push失敗 ($i/3) → 5秒待って再試行"; sleep 5
          done
          echo "::warning::状態の保存(push)に失敗しました。次回実行で再通知が起きる可能性があります"

      - name: 次の監視を自動で開始（GITHUB_TOKENで起動・PAT不要）
        # 手動で止めた(cancelled)時は起動しない。異常終了でも、30分以上動いていたなら
        # 一時的な失敗とみなして再起動する（すぐ落ちる不具合の時は連続再起動しない）。
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          elapsed=$(( $(date +%s) - ${START_TS:-0} ))
          if [ "$JOB_STATUS" != "success" ] && [ "$elapsed" -lt 1800 ]; then
            echo "::warning::開始から${elapsed}秒で異常終了したため、連続再起動を避けて自動起動しません（定時起動が保険）"
            exit 0
          fi
          # GITHUB_TOKEN が起こしたイベントは普通は新しい実行を作らないが、
          # workflow_dispatch だけは例外的に作れる（GitHubの仕様）
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/dispatch.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"${{ github.ref_name }}"}')
            if [ "$code" = "204" ]; then echo "次の監視を起動しました"; exit 0; fi
            echo "起動に失敗 (HTTP $code): $(head -c 300 /tmp/dispatch.txt) → 再試行 $i/3"; sleep 10
          done
          echo "::warning::次の監視を起動できませんでした（定時起動が保険）"

