# KINDAL 新着監視を「定期的に自動実行」するワークフロー
name: KINDAL新着監視

on:
  schedule:
    # 30分ごとに自動実行（数字を変えれば間隔を変えられます。例: "*/15 * * * *" で15分ごと）
    - cron: "*/30 * * * *"
  workflow_dispatch: # 手動でも動かせるように

# 結果（見た商品リスト）をリポジトリに保存するための書き込み権限
permissions:
  contents: write

# 同時に2つ動いて記録がぶつからないようにする
concurrency:
  group: kindal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 新着監視を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/monitor.py

      - name: 見た商品リストを保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state
          # 変化があった時だけ記録する（無ければ何もしない）
          git commit -m "新着監視: 状態を更新 [skip ci]" || { echo "変更なし"; exit 0; }
          # 念のため最新を取り込んでから保存する
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push をスキップしました"
