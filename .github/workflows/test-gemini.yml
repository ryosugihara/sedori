# Gemini(無料AI)のカギの動作テスト（軽量・1分で終わる）
name: AIカギの動作テスト

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/test_gemini.py"
      - ".github/workflows/test-gemini.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 相場DBをReleaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p せどり/データ/data
          if python せどり/コーディング/scripts/db_release.py download; then
            echo "相場DBを取得しました"
          else
            echo "相場DBがまだ無い"
          fi

      - name: テストを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python せどり/コーディング/scripts/test_gemini.py
