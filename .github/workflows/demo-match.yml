# 画像判定のテスト通知（手動＋このファイル/スクリプト更新時に自動実行）
name: 画像判定テスト

on:
  workflow_dispatch:
    inputs:
      brands:
        description: "対象ブランド(カンマ区切り。空なら②全部)"
        default: ""
        required: false
      per_brand:
        description: "1ブランドあたり調べる件数"
        default: "12"
        required: false
      top_n:
        description: "Discordに送る件数"
        default: "5"
        required: false

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ（2回目から速くなる）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: 画像判定AIを準備
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python-headless sentence-transformers pillow

      - name: テスト通知を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEMO_BRANDS: ${{ github.event.inputs.brands }}
          DEMO_PER_BRAND: ${{ github.event.inputs.per_brand || '12' }}
          DEMO_TOP_N: ${{ github.event.inputs.top_n || '5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 無料AIのカギ(あれば最終確認に使う)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 有料AIのカギ(任意)
        run: python せどり/コーディング/scripts/demo_match.py

      - name: 結果メモを保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/recon
          git commit -m "画像判定テスト結果を保存 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
