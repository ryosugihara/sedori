# メルカリ相場DB 収集（2週間に1回：毎月1日と15日の昼12時ごろ＋手動もOK）
name: メルカリ相場DB収集

on:
  schedule:
    - cron: "0 3 1,15 * *" # 毎月1日と15日の 03:00 UTC = 日本時間 12:00
  workflow_dispatch:

permissions:
  contents: write

# 収集どうしがぶつからないようにする
concurrency:
  group: collect-souba
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ（2回目から速くなる）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: 必要な道具を入れる
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet sentence-transformers pillow pyjwt cryptography

      - name: 相場を収集してDBに保存
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/collect_souba.py

      - name: DBをリポジトリに保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/souba_db.sqlite
          git commit -m "メルカリ相場DBを更新 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
