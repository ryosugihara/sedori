# KINDAL新着通知の診断（Discordには送らない）。
# 結果は せどり/データ/diag/kindal_notify_diag.txt に保存する（トークンなしで読めるように）。
# このファイルか診断プログラムを保存(push)すると自動で動く。
name: KINDAL通知の診断

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adoring-bell-7rqznj
    paths:
      - "せどり/コーディング/scripts/notify_diag.py"
      - ".github/workflows/notify-diag.yml"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: 画像判定AIを準備（本番の新着監視と同じ）
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu || true
          pip install --quiet opencv-python-headless sentence-transformers pillow || true

      - name: 相場DBを取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python せどり/コーディング/scripts/db_release.py download || echo "相場DBなし"

      - name: 診断を実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "1" にすると『通知されるはず』の1件を実際にDiscordへ送って返事を記録する。
          # このワークフローは保存(push)のたびに自動で動くため、普段は "0"（送らない）にしておく
          DIAG_SEND: "0"
        run: python せどり/コーディング/scripts/notify_diag.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add せどり/データ/diag || true
          git commit -m "KINDAL通知の診断結果 [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push && exit 0
            sleep 5
          done
