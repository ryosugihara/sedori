# 在庫スキャン：②ブランドの「今ある出品」から利益が出そうな商品を1回だけ探して通知
# （新着監視とは別。手動で実行する棚卸し用）
name: 在庫スキャン(利益さがし)

on:
  workflow_dispatch: # 手動で実行する
    inputs:
      scan_max:
        description: "通知する最大件数（多すぎ防止）"
        default: "30"
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ（2回目から速くなる）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: 画像判定AIを準備
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python-headless sentence-transformers pillow

      - name: 在庫スキャンを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCAN_PROFIT: "1" # 棚卸しスキャンモード
          SCAN_MAX: ${{ github.event.inputs.scan_max || '30' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 無料AIのカギ(あれば最終確認に使う)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 有料AIのカギ(任意)
        run: python せどり/コーディング/scripts/monitor.py
