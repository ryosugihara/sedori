# テスト通知を1通送るだけのワークフロー（手動実行用）
name: テスト通知

on:
  workflow_dispatch:

# 監視ループとは別グループにして、すぐ実行されるようにする
concurrency:
  group: test-notify

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: テスト通知を送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/test_notify.py
