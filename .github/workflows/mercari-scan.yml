# メルカリ内 仕入れスキャン（販売中の商品を相場DBと照合して掘り出し物を探す）
name: メルカリ内スキャン

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "対象（ブランド|キーワード を改行区切り。空ならアーカイブバッグ既定）"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AIモデルの置き場をキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-and-dinov2

      - name: AIの道具を入れる
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet opencv-python-headless sentence-transformers transformers pillow pyjwt cryptography

      - name: メルカリ内スキャンを実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCAN_TARGETS: ${{ github.event.inputs.targets }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 無料AIのカギ(あれば最終確認に使う)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 有料AIのカギ(任意)
        run: python scripts/mercari_scan.py

      - name: 結果メモを保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add recon
          git commit -m "メルカリ内スキャン結果を保存 [skip ci]" || echo "変更なし"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || echo "push スキップ"
